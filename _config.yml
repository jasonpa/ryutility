title: Ryutility
description: Free running calculators for pace, VDOT training zones, heart-rate zones, race prediction, splits, and treadmill conversion.
url: "https://ryutility.com"
plugins:
  - jekyll-sitemap
collections:
  guides:
    output: true
    permalink: /guides/:slug/
defaults:
  - scope:
      path: ""
      type: "guides"
    values:
      layout: "guide"
exclude:
  - Gemfile
  - Gemfile.lock
  - docs
  - tests
  - .superpowers
  - .playwright-mcp
  - "*.png"
  - README.md
  - CLAUDE.md
  - vendor
  - .bundle
